<div class="lightbox" id="lightbox">

<script>
  const lightbox = document.getElementById('lightbox');
  const lightboxImage = document.getElementById('lightbox-image');

  document.querySelectorAll('.gallery-photo').forEach(link => {
    link.addEventListener('click', event => {
      event.preventDefault();
      lightboxImage.src = link.href;
      lightbox.classList.add('open');
    });
  });

  function closeLightbox() {
    lightbox.classList.remove('open');
    lightboxImage.src = '';
  }

  document.querySelector('.lightbox-close').addEventListener('click', closeLightbox);

  lightbox.addEventListener('click', event => {
    if (event.target === lightbox) {
      closeLightbox();
    }
  });

  document.addEventListener('keydown', event => {
    if (event.key === 'Escape') {
      closeLightbox();
    }
  });
</script>
<script>
(() => {
  const gallery=document.querySelector('.photo-gallery');
  if(!gallery) return;
  const photos=Array.from(gallery.querySelectorAll(':scope > .gallery-photo'));
  // Fisher–Yates: each visit gets a fresh order without changing the saved page.
  for(let i=photos.length-1;i>0;i--) {
    const j=Math.floor(Math.random()*(i+1));
    [photos[i],photos[j]]=[photos[j],photos[i]];
  }
  const fragment=document.createDocumentFragment();
  photos.forEach(photo=>{
    photo.style.setProperty('--tilt',(Math.random()*5-2.5).toFixed(2)+'deg');
    photo.style.setProperty('--lift',(Math.random()*12-6).toFixed(1)+'px');
    fragment.append(photo);
  });
  gallery.append(fragment);
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches && 'IntersectionObserver' in window) {
    const observer=new IntersectionObserver(entries=>{
      entries.forEach(entry=>{
        if(!entry.isIntersecting) return;
        entry.target.classList.add('arriving');
        entry.target.addEventListener('animationend',()=>entry.target.classList.remove('arriving'),{once:true});
        observer.unobserve(entry.target);
      });
    },{threshold:.12});
    photos.forEach(photo=>observer.observe(photo));
  }
})();
</script>
